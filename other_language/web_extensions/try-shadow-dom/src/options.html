<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
	</head>
	<body>
		<form id="form">
			<label>
				Horizontal position
				<input id="position-x" type="number"
					min="0" max="100" step="1" required>
			</label>
			<label>
				Vertical position
				<input id="position-y" type="number"
					min="0" max="100" step="1" required>
			</label>
			<button type="submit" id="submit">OK</button>
		</form>
		<script type="module" src="options.js"></script>
	</body>
</html>
