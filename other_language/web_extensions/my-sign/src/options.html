<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport"
		      content="width=device-width, initial-scale=1">
		<title>My Sign</title>
		<link rel="stylesheet" href="options.css">
	</head>
	<body>
		<form id="generate-form">
			<label>
				Account name
				<input id="account-name" type="text" required>
			</label>
			<label>
				Password
				<input id="password" type="password" required>
			</label>
			<label>
				Confirm password
				<input id="password-confirm" type="password" required>
			</label>
			<label>
				<input id="show-password" type="checkbox">
				Show password
			</label>
			<div id="password-error"></div>
			<button id="generate" type="submit">Generate</button>
		</form>
		<hr>
		<form id="client-form">
		<label>
			Client name
			<input id="client-name" type="text" required>
		</label>
		<label>
			Client URL Pattern
			<input id="url-pattern" type="text" required>
		</label>
		<label>
			<input id="use-hash" type="checkbox">
			Use fragment for Client selection
		</label>
		<label>
			Fragment
			<input id="hash" type="text" disabled required>
		</label>
		<label>
			Public key
			<select id="current-key" size="8"></select>
		</label>
		<button id="add-client">Add client</button>
		</form>

		<div id="clients"></div>

		<div id="client-detail" hidden>
			CLIENT DETAIL
		<form id="client-form-d">
		<label>
			Client name
			<input id="client-name-d" type="text" required>
		</label>
		<label>
			Client URL Pattern
			<input id="url-pattern-d" type="text" required>
		</label>
		<label>
			<input id="use-hash-d" type="checkbox">
			Use fragment for Client selection
		</label>
		<label>
			Fragment
			<input id="hash-d" type="text" disabled required>
		</label>
		<label>
			Public key
			<select id="current-key-d" size="8"></select>
		</label>
		<button id="add-client-d">Apply</button>
		</form>
		</div>

		<div id="public-keys"></div>
		<pre id="for-debug"></pre>

		<script type="module" src="options.js"></script>
	</body>
</html>
